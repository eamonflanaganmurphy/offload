# XcodeGen spec. Offload.xcodeproj is generated from this file (CI does it on
# every build); on a Mac, run `xcodegen` (brew install xcodegen) to get one.
name: Offload
options:
  bundleIdPrefix: me.eamonmurphy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  OffloadCore:
    path: Packages/OffloadCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your team in Xcode (Signing & Capabilities); a free Apple ID works.
    DEVELOPMENT_TEAM: LHVC7499G5
targets:
  Offload:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Offload
    dependencies:
      - package: OffloadCore
        product: OffloadCore
    info:
      path: Offload/Info.plist
      properties:
        CFBundleDisplayName: Offload
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # offload://setup?server=...&key=... fills in Settings from a link.
        CFBundleURLTypes:
          - CFBundleURLName: me.eamonmurphy.offload
            CFBundleURLSchemes: [offload]
        # For an Immich server reached by its LAN address over plain http.
        NSLocalNetworkUsageDescription: Offload uploads to your Immich server, which may be on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.eamonmurphy.offload
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
